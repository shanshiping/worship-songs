services:
  postgres:
    image: postgres:16-alpine
    container_name: worship-songs-db
    restart: unless-stopped
    ports:
      # 若本机 5432 已被占用：POSTGRES_PORT=5433 docker compose up -d
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: worship_songs
    volumes:
      - worship_songs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d worship_songs"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  worship_songs_pgdata:
